{% extends "base.html" %}

{% block title %}🎰 Stake Style Slot{% endblock %}

{% block extra_style %}
<style>

body{
  margin:0;
  background:#1a2c38;
  color:white;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:flex-start; /* Pomeramo na vrh radi skrolovanja */
  min-height:110vh;
  padding: 80px 10px 20px 10px; /* Povećan padding zbog menija */
  overflow-y: auto; /* Dozvoljavamo skrol ako zatreba */
}

.slot-wrapper{
  text-align:center;
  width: 100%;
  max-width: 650px;
}

h1{
  margin-bottom: 20px;
  font-size: 26px;
  color: #00e701;
  text-shadow: 0 0 10px rgba(0, 231, 1, 0.3);
}

.balance{
  margin-bottom:10px;
  font-size:22px;
  font-weight: bold;
  color: #ffd700;
}

.bet-input-container {
  background: #213743;
  padding: 10px;
  border-radius: 8px;
  margin: 15px auto;
  max-width: 350px;
}

.bet-input-wrapper {
  display: flex;
  background: #2f4553;
  border-radius: 4px;
  padding: 4px;
  align-items: center;
  border: 2px solid #2f4553;
  transition: border-color 0.2s;
}

.bet-input-wrapper:focus-within {
  border-color: #557086;
}

#betInput {
  background: transparent;
  border: none;
  color: white;
  padding: 8px;
  flex-grow: 1;
  font-size: 16px;
  font-weight: bold;
  outline: none;
  width: 60px;
}

.bet-action-btn {
  background: #213743;
  border: none;
  color: white;
  padding: 8px 12px;
  cursor: pointer;
  font-weight: bold;
  border-radius: 4px;
  margin-left: 4px;
  font-size: 13px;
  transition: background 0.2s;
}

.bet-action-btn:hover {
  background: #3c5261;
}

.board{
  position:relative;
  display:flex;
  gap:6px;
  background:#0f212e;
  padding:10px;
  height: 380px; /* Fiksna visina: 6 simbola po 60px + 20px padding */
  width: fit-content;
  margin: 0 auto;
  border-radius:20px;
  border: 4px solid #2f4553;
}

.reel{
  width: 75px;
  height: 360px; 
  overflow:hidden;
  background:#111;
  border-radius:15px;
  position:relative;
  border: none;
}
.reel-strip{
  display:flex;
  flex-direction:column;
  height: 100%;
}

.symbol{
  width:75px;
  height:60px;
  flex: 0 0 60px; /* Forsira tačnu visinu bez odstupanja */

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:30px;

  box-shadow: inset 0 -1px 0 rgba(255,255,255,0.05); /* Linija bez uticaja na visinu */

  transition:
  transform .2s, background .2s;
}

.symbol.win{
  background: rgba(0, 231, 1, 0.2);
  animation: winPulse 0.4s infinite alternate;
  box-shadow:
  0 0 20px rgba(0, 231, 1, 0.5);
  border-radius: 10px;
  z-index: 10;
}

@keyframes winPulse {
  0% { transform: scale(1); filter: brightness(1); }
  100% { 
    transform: scale(1.15); 
    filter: brightness(1.5) drop-shadow(0 0 15px #00e701);
  }
}

.controls{
  margin-top: 20px;
  background: #213743;
  padding: 20px;
  border-radius: 15px;
}

.controls button{
  padding:10px 18px;

  border:none;
  border-radius:12px;

  background:#2f4553;
  color:white;

  font-weight:bold;
  font-size:16px;

  cursor:pointer; /* Ispravljen cursor */

  margin:0 8px;
  transition: background 0.2s;
}

#spinBtn {
  background: #00e701;
  color: #010101;
}

.controls button:hover{
  filter: brightness(1.2);
}

#buyBtn{
  background:#ffcc00;
}

#autoBtn{
  background:#00b0ff;
}
#msg{
  margin-top:15px;
  font-size:20px;
}

.blur{
  filter:blur(2px);
}

.bounce{
  animation:bounce .3s;
}

@keyframes bounce{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

.win-line{
  position:absolute;

  height:6px;

  background:#00ff99;

  border-radius:20px;

  box-shadow:
  0 0 10px #00ff99,
  0 0 20px #00ff99;

  pointer-events:none;

  z-index:999;

  animation:lineFlash .4s infinite alternate;
}

@keyframes lineFlash{
  from{opacity:.6;}
  to{opacity:1;}
}

.bonus-mode{
  animation:bonusGlow 1s infinite alternate;
}

@keyframes bonusGlow{
  from{
    box-shadow:
    0 0 20px gold,
    0 0 40px orange;
  }

  to{
    box-shadow:
    0 0 40px gold,
    0 0 80px orange;
  }
}

.jackpot-banner {
  background: linear-gradient(90deg, #1e293b, #ef4444, #1e293b);
  padding: 6px;
  border: 2px solid gold;
  border-radius: 15px;
  margin-bottom: 10px;
  box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
  animation: jackpotGlow 2s infinite;
}

@keyframes jackpotGlow {
  0% { transform: scale(1); box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
  50% { transform: scale(1.02); box-shadow: 0 0 40px rgba(234, 179, 8, 0.8); }
  100% { transform: scale(1); box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
}

#bigWinOverlay {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 80px;
  font-weight: 900;
  background: linear-gradient(to right, #ef4444, #facc15, #22c55e, #3b82f6, #9333ea);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
  z-index: 1000;
  pointer-events: none;
  transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  animation: rainbow 2s linear infinite;
}

#bigWinOverlay.show {
  transform: translate(-50%, -50%) scale(1);
}

#totalWinOverlay {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  z-index: 1100;
  pointer-events: none;
  text-align: center;
  transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#totalWinOverlay.show {
  transform: translate(-50%, -50%) scale(1);
}
#totalWinOverlay .tw-label {
  font-size: 38px;
  font-weight: 900;
  letter-spacing: 4px;
  color: #ffd700;
  text-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
}
#totalWinOverlay .tw-amount {
  font-size: 74px;
  font-weight: 900;
  color: #22c55e;
  text-shadow: 0 0 25px rgba(34, 197, 94, 0.7);
}

.multiplier-tag {
  font-size: 22px;
  color: #ffcc00;
  margin: 5px 0;
  font-weight: bold;
}

@keyframes drop{

  0%{
    transform:
    translateY(-120px);

    opacity:0;
  }

  60%{
    transform:
    translateY(15px);

    opacity:1;
  }

  100%{ /* Ispravljen keyframe */
    transform: translateY(0);
  }
}

</style>
{% endblock %}

{% block content %}

<div class="slot-wrapper">
  <h1>ULTIMATE SLOT</h1>

  <div class="jackpot-banner">
    <div style="font-size: 14px; color: white;">🔥 GLOBAL JACKPOT 🔥</div>
    <div style="font-size: 32px; color: gold; font-weight: bold;">€<span id="jackpotAmount">10000</span></div>
  </div>

  <div class="balance">
    💰 Balans:
    €<span id="balance">2000</span>
  </div>

  <div class="multiplier-tag" id="multDisplay">
    MULTIPLIER: x1
  </div>

  <div class="bet-input-container">
    <div style="font-size: 12px; color: #94a3b8; text-align: left; margin-bottom: 5px; font-weight: bold; text-transform: uppercase;">Ulog</div>
    <div class="bet-input-wrapper">
      <input type="number" id="betInput" value="10" min="10" step="10">
      <button class="bet-action-btn" onclick="modifyBet(0.5)">½</button>

  </div>

  <div id="msg">READY</div>

  <div id="bigWinOverlay">BIG WIN!</div>

    <div class="tw-label">TOTAL WIN</div>
    <div class="tw-amount">€<span id="totalWinAmount">0</span></div>
  </div>

</div>

<audio id="spinSound"
src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>

<audio id="winSound"
src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
{% endblock %}

{% block extra_js %}
<script>

const ROWS = 6;
const COLS = 6;

const symbols = [
  "🍒",
  "🍋",
  "🔔",
  "💎",
  "7️⃣",
  "🍀",
  "🔥"
];

const WILD = "🌟";
const SCATTER = "⭐";

const paytable = {
  "🍒": 0.07,  // Najcesci simbol - vraca mali deo uloga
  "🍋": 0.25,
  "🔔": 0.6,
  "🍀": 1.5,
  "🔥": 4.0,
  "💎": 10.0,
  "7️⃣": 30.0,
  "🌟": 4.0,   // Wild (zamenjuje druge simbole)
  "⭐": 0.0    // Scatter - ne isplacuje liniju, sluzi za free spinove
};

const state = {
  balance: Number('{{ current_user.balance | default(1000) }}'),
  bet:10,
  turbo:false,
  spinning:false,
  board:[],

  bonus:false,
  freeSpins:0,
  baseMultiplier:1,
  currentMultiplier:1,

  autoSpin:false
};

const boardEl = document.getElementById("board");
const msg = document.getElementById("msg");
const balanceEl = document.getElementById("balance");
const jackpotEl = document.getElementById("jackpotAmount");
let lastBalance = null;

const betInput = document.getElementById("betInput");

const spinSound = document.getElementById("spinSound");
const winSound = document.getElementById("winSound");

spinSound.volume = 0.15;
winSound.volume = 0.25;

let reels = [];

function randSymbol(){

  let r = Math.random();
  
  // STROŽE VEROVATNOĆE (Weights)
  // 🍒 (45%), 🍋 (25%), 🔔 (15%), 🍀 (8%), 🔥 (4%), 💎 (2%), 7️⃣ (1%)
  const weightedSymbols = [
    { s: "🍒", w: 0.45 }, { s: "🍋", w: 0.70 }, { s: "🔔", w: 0.85 },
    { s: "🍀", w: 0.93 }, { s: "🔥", w: 0.97 }, { s: "💎", w: 0.99 }, { s: "7️⃣", w: 1.00 }
  ];

  if(state.bonus){
    if(r < 0.08) return WILD; 
    if(r < 0.12) return SCATTER;
  }else{
    if(r < 0.015) return WILD; // Wild je sada veoma redak (1.5%)
    if(r < 0.035) return SCATTER; // Bonus je redak (2%)
  }

  // Odabir simbola na osnovu težine (Sada se zapravo izvršava!)
  let symbolRnd = Math.random();
  for(let item of weightedSymbols) {
    if(symbolRnd <= item.w) return item.s;
  }
  return "🍒"; 
}

function createBoard(){

  state.board = [];

  for(let r=0;r<ROWS;r++){

    let row=[];

    for(let c=0;c<COLS;c++){

      row.push(randSymbol());

    }

    state.board.push(row);
  }
}

function init(){

  for(let c=0;c<COLS;c++){

    const reel = document.createElement("div");
    reel.className = "reel";

    const strip = document.createElement("div");
    strip.className = "reel-strip";

    reel.appendChild(strip);

    boardEl.appendChild(reel);

    reels.push(strip);
  }

  createBoard();

  render();
}

function render(withFall=false){

  for(let c=0;c<COLS;c++){

    reels[c].innerHTML="";

    for(let r=0;r<ROWS;r++){

      const s =
      document.createElement("div");

      s.className="symbol";

      s.textContent =
      state.board[r][c];

      if(withFall){

        s.style.animation =
        `drop .35s ease ${r*0.05}s`;
      }

      reels[c].appendChild(s);
    }
  }
}

function modifyBet(multiplier) {
  if (state.spinning) return;
  let newBet = state.bet * multiplier;
  setBet(newBet);
}

function setMaxBet() {
  if (state.spinning) return;
  setBet(state.balance);
}

function setBet(amount) {
  let val = Math.floor(amount);
  if (val < 10) val = 10;
  if (val > state.balance) val = Math.floor(state.balance);
  
  state.bet = val;
  betInput.value = state.bet;
}

betInput.addEventListener('input', (e) => {
  let val = parseInt(e.target.value);
  if (!isNaN(val)) state.bet = val;
});

function updateMultDisplay() {
    const el = document.getElementById("multDisplay");
    el.textContent = `MULTIPLIER: x${state.currentMultiplier}`;
    el.classList.remove("pulse");
    void el.offsetWidth; // Force reflow
    el.classList.add("pulse");
}

function animateValue(el, start, end, duration) {
    let startTimestamp = null;
    const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const value = Math.floor(progress * (end - start) + start);
        el.textContent = value;
        if (progress < 1) {
            window.requestAnimationFrame(step);
        }
    };
    window.requestAnimationFrame(step);
}

let jackpot = Number(localStorage.getItem('casino_jackpot2')) || 1000;
jackpotEl.textContent = Math.floor(jackpot);

async function spin(){

  if(state.spinning) return 0;

  const moneyBefore = state.balance;

  if(!state.bonus){

    if(state.balance < state.bet){

      msg.textContent = "NEMA NOVCA 😢";
      return 0;
    }

    state.balance -= state.bet;

    updateBalance();
  }

  // Jackpot doprinos
  jackpot += state.bet * 0.02;
  localStorage.setItem('casino_jackpot2', jackpot);
  jackpotEl.textContent = Math.floor(jackpot);

  state.currentMultiplier = state.bonus ? 2 : 1;
  updateMultDisplay();
  state.spinning = true;

  msg.textContent =
  state.bonus
  ? `FREE SPINS: ${state.freeSpins}`
  : "OKRETANJE 🎰";

  document.getElementById("spinBtn").disabled=true;

  spinSound.currentTime=0;
  spinSound.play();

  createBoard();

  const finalBoard =
  JSON.parse(JSON.stringify(state.board));

  let speed =
  state.turbo ? 20 : 50;

  let delay =
  state.turbo ? 250 : 500;

  for(let c=0;c<COLS;c++){

    animateReel(c,speed);

    await sleep(delay);

    stopReel(c,finalBoard);
  }

  await sleep(500);

  let totalWin =
  await runCascade();

  // Jackpot Win Chance (0.03% - redak dogadjaj, ranije 0.5% i pun pool = ogroman visak)
  if (Math.random() < 0.0003) {
      totalWin += Math.floor(jackpot);
      msg.textContent = "🔥 JACKPOT WON! 🔥";
      jackpot = 500;
      localStorage.setItem('casino_jackpot2', jackpot);
      jackpotEl.textContent = jackpot;
  }

  if(totalWin > 0){
    
    if (totalWin >= state.bet * 10) {
        const overlay = document.getElementById("bigWinOverlay");
        overlay.classList.add("show");
        setTimeout(() => overlay.classList.remove("show"), 2000);
    }

    msg.textContent =
    `DOBITAK €${totalWin}`;

    winSound.currentTime=0;
    winSound.play();

    state.balance += totalWin;

    updateBalance();

    // Provera za Scattere (besplatni spinovi) - sada zaista BESPLATNO i redje (5+ scattera)
    let scatterCount = state.board.flat().filter(s => s === SCATTER).length;
    if (scatterCount >= 5 && !state.bonus) {
        msg.textContent = "FREE SPINS TRIGGERED! 🎁";
        setTimeout(startFreeSpins, 1000); // Besplatni bonus, bez naplate
    }

  }else{

    msg.textContent =
    "NEMA DOBITKA 😢";
  }

  // Šaljemo neto rezultat spina u istoriju
  updateBalance("Slot", state.balance - moneyBefore);

  state.spinning=false;

  document.getElementById("spinBtn").disabled=false;

  return totalWin;
}

function animateReel(col,speed){

  reels[col].classList.add("blur");

  let interval = setInterval(()=>{

    for(let r=0;r<ROWS;r++){

      state.board[r][col]=randSymbol();
    }

    render();

  },speed);

  reels[col].dataset.interval=interval;
}

function stopReel(col,finalBoard){

  clearInterval(reels[col].dataset.interval);

  for(let r=0;r<ROWS;r++){

    state.board[r][col]=finalBoard[r][col];
  }

  render();

  reels[col].classList.remove("blur");

  reels[col].classList.add("bounce");

  setTimeout(()=>{

    reels[col].classList.remove("bounce");

  },300);
}

function checkWins(){

  let wins=[];

  for(let r=0;r<ROWS;r++){
    let row = state.board[r];
    let bestMatch = [];
    let bestSymbol = "";

    // Proveravamo svaku moguću početnu poziciju u redu
    for (let startCol = 0; startCol < COLS; startCol++) {
      let symbolAtStart = row[startCol];
      if (symbolAtStart === "" || symbolAtStart === SCATTER) continue;

      // Određujemo koji simbol zapravo tražimo (ako je prvi WILD, tražimo prvi sledeći običan)
      let target = symbolAtStart;
      if (symbolAtStart === WILD) {
        for (let i = startCol; i < COLS; i++) {
          if (row[i] !== WILD && row[i] !== "") {
            target = row[i];
            break;
          }
        }
      }

      let currentMatch = [];
      for (let c = startCol; c < COLS; c++) {
        if (row[c] === target || row[c] === WILD) {
          currentMatch.push({ row: r, col: c });
        } else {
          break; // Prekid niza
        }
      }

      if (currentMatch.length >= 3 && currentMatch.length > bestMatch.length) {
        bestMatch = currentMatch;
        bestSymbol = target;
      }
    }

    if(bestMatch.length >= 3){
      wins.push({
        symbol: bestSymbol,
        cells: bestMatch,
        count: bestMatch.length
      });
    }
  }

  return wins;
}

function highlight(wins){

  document
  .querySelectorAll(".symbol")
  .forEach(x=>x.classList.remove("win"));

  wins.forEach(w=>{

    w.cells.forEach(cell=>{

      let idx =
      cell.col * ROWS + cell.row;

      document
      .querySelectorAll(".symbol")[idx]
      .classList.add("win");

    });

  });
}

function drawWinLines(wins){

  document
  .querySelectorAll(".win-line")
  .forEach(x=>x.remove());

  wins.forEach(w=>{

    if(w.cells.length < 2) return;

    let first = w.cells[0];
    let last = w.cells[w.cells.length - 1];

    let line =
    document.createElement("div");

    line.className="win-line";

    let startX =
    first.col * 83 + 47.5;

    let endX =
    last.col * 83 + 47.5;

    let y =
    first.row * 60 + 40;

    line.style.left =
    startX + "px";

    line.style.top =
    y + "px";

    line.style.width =
    (endX - startX) + "px";

    boardEl.appendChild(line);

  });
}

function triggerShake() {
  boardEl.classList.remove("shake-effect");
  void boardEl.offsetWidth; 
  boardEl.classList.add("shake-effect");
  setTimeout(() => boardEl.classList.remove("shake-effect"), 300);
}

async function runCascade(){

  let total=0;
  while(true){

    let wins = checkWins();
    if(wins.length===0) break;

    triggerShake();

    wins.forEach(w => {
      // Proporcionalna isplata: (broj simbola / 3) * osnovna vrednost simbola
      let symPay = paytable[w.symbol] || 0;
      let winValue = (w.count / 3) * state.bet * symPay;
      total += winValue * state.currentMultiplier;
    });

    // Mnozilac raste sa kaskadama ali je ogranicen (bez ovoga je RTP eksplodirao)
    if (state.currentMultiplier < 3) state.currentMultiplier++;
    updateMultDisplay();

    highlight(wins);

    drawWinLines(wins);

    await sleep(600);

    removeWins(wins);

    render();

    document
    .querySelectorAll(".win-line")
    .forEach(x=>x.remove());

    await sleep(200);

    dropDown();

    render(true);

    await sleep(700);
  }

  return total;
}

function removeWins(wins){
  wins.forEach(w=>{
    w.cells.forEach(cell=>{
      let idx = cell.col * ROWS + cell.row;
      let symElements = document.querySelectorAll(".symbol");
      if(symElements[idx]) {
        symElements[idx].classList.add("symbol-pop");
      }
      state.board[cell.row][cell.col]="";
    });
  });
}

function dropDown(){

  for(let c=0;c<COLS;c++){

    let stack=[];

    for(let r=ROWS-1;r>=0;r--){

      if(state.board[r][c] !== ""){

        stack.push(state.board[r][c]);
      }
    }

    for(let r=ROWS-1;r>=0;r--){

      state.board[r][c] =
      stack.shift() || randSymbol();
    }
  }
}

// Besplatni bonus aktiviran scatterima (bez naplate, za razliku od buyFeature)
async function startFreeSpins(){

  if(state.spinning) return;

  state.bonus = true;
  state.freeSpins = 10;
  state.currentMultiplier = 2;

  boardEl.classList.add("bonus-mode");

  msg.textContent = "FREE SPINS ⭐";

  await sleep(1500);

  runBonusSpins();
}

async function buyFeature(){

  if(state.spinning) return;

  let cost = state.bet * 50;

  if(state.balance < cost){

    msg.textContent =
    "NOT ENOUGH MONEY 💸";

    return;
  }

  state.balance -= cost;

  updateBalance();

  state.bonus = true;

  state.freeSpins = 10;
  state.currentMultiplier = 2;

  boardEl.classList.add("bonus-mode");

  msg.textContent =
  "FEATURE ACTIVATED ⭐";

  await sleep(1500);

  runBonusSpins();
}

async function runBonusSpins(){

  let bonusTotalWin = 0;

  while(state.freeSpins > 0){

    bonusTotalWin += await spin();

    state.freeSpins--;

    await sleep(700);
  }

  state.bonus = false;

  boardEl.classList.remove("bonus-mode");

  msg.textContent =
  "BONUS FINISHED 🎉";

  // Prikazi ukupan dobitak bonusa sa rastucom animacijom
  showTotalWin(bonusTotalWin);
}

// Prikazuje "TOTAL WIN" overlay sa animacijom rastuceg iznosa
function showTotalWin(amount){
  const overlay = document.getElementById("totalWinOverlay");
  const amountEl = document.getElementById("totalWinAmount");

  amount = Math.floor(amount);
  amountEl.textContent = "0";
  overlay.classList.add("show");

  // Duze brojanje za vece dobitke (od 1.2s do 4s)
  const duration = Math.min(4000, Math.max(1200, amount * 4));
  animateValue(amountEl, 0, amount, duration);

  // Sakrij overlay nakon sto se brojanje zavrsi (plus pauza da igrac vidi iznos)
  setTimeout(() => overlay.classList.remove("show"), duration + 2500);
}

async function autoSpinLoop(){

  while(state.autoSpin){

    if(state.balance < state.bet){

      msg.textContent =
      "NO MONEY 😢";

      state.autoSpin = false;

      break;
    }

    await spin();

    await sleep(
      state.turbo ? 200 : 800
    );
  }

  document
  .getElementById("autoBtn")
  .textContent =
  "AUTO ▶";
}

function sleep(ms){

  return new Promise(r=>setTimeout(r,ms));
}

function updateBalance(gameName, amount){
  if (lastBalance === null) {
    balanceEl.textContent = state.balance;
    lastBalance = state.balance;
  } else if (lastBalance !== state.balance) {
    animateValue(balanceEl, lastBalance, state.balance, 500);
    lastBalance = state.balance;
  }
  localStorage.setItem('casino_balance', state.balance);

  const payload = { balance: state.balance, game_name: gameName, amount: amount };
  if (gameName && amount !== undefined) {
      payload.game_name = gameName;
      payload.amount = amount;
  }

  fetch('/update_balance', {
      method: 'POST',
      keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
  });

  if(state.bet > state.balance){

    state.bet = Math.max(10, Math.floor(state.balance));
    betInput.value = state.bet;
  }
}

function claimDailyBonus() {
  const now = Date.now();
  const lastClaim = localStorage.getItem('last_bj_bonus');
  const day = 24 * 60 * 60 * 1000;

  if (!lastClaim || now - lastClaim > day) {
    state.balance += 100;
    localStorage.setItem('last_bj_bonus', now);
    updateBalance();
    alert("🎁 Preuzeli ste €100 dnevnog bonusa!");
  } else {
    const timeLeft = Math.ceil((day - (now - lastClaim)) / (1000 * 60 * 60));
    alert(`Bonus je dostupan ponovo za ${timeLeft} sati.`);
  }
}

window.addEventListener('storage', (e) => {
  if (e.key === 'casino_balance') {
    state.balance = Number(e.newValue);
    updateBalance();
  }
});

document
.getElementById("spinBtn")
.addEventListener("click",spin);

document
.getElementById("buyBtn")
.addEventListener("click",buyFeature);

document
.getElementById("turboBtn")
.addEventListener("click",()=>{

  state.turbo=!state.turbo;

  document
  .getElementById("turboBtn")
  .textContent =
  state.turbo
  ? "TURBO ON ⚡"
  : "TURBO";
});

document
.getElementById("autoBtn")
.addEventListener("click", async ()=>{

  state.autoSpin =
  !state.autoSpin;

  document
  .getElementById("autoBtn")
  .textContent =
  state.autoSpin
  ? "STOP ⛔"
  : "AUTO ▶";

  if(state.autoSpin){

    autoSpinLoop();
  }
});

init();
updateBalance();
</script>
