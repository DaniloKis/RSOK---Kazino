<div class="nav-container">

<h1>🎰 Casino Roulette</h1>

<div class="info-row">
    <div>
        Novac: €<span id="money">1000</span>
    </div>

    <div>
        Trenutni čip: €<span id="chipValue">10</span>

<div class="roulette-container">

    

    <canvas id="wheel" width="360" height="360"></canvas>

<h2>Sto za klađenje</h2>

<div class="casino-table">

    <div class="spin-button-column">
        <div class="spin-controls">
            <div class="spin-dropdown-container">
                <button class="spin-btn"
                        id="spinBtn"
                        onclick="spinWheel()">

                </button>

                <button class="chip-btn"

                <div class="chip-dropdown">

         onclick="placeSpecialBet('green')">

        <div class="bet-chip"
             id="special-green"></div>

        <div class="numbers-grid"
             id="rouletteTable"></div>

        <div class="bottom-bets">

            <div class="dozen-btn"
                 onclick="placeSpecialBet('dozen1')">

                1 - 12

                <div class="bet-chip"
                     id="special-dozen1"></div>

            </div>

            <div class="dozen-btn"
                 onclick="placeSpecialBet('dozen2')">

                13 - 24

                <div class="bet-chip"
                     id="special-dozen2"></div>

            </div>

            <div class="dozen-btn"
                 onclick="placeSpecialBet('dozen3')">

                25 - 36

                <div class="bet-chip"
                     id="special-dozen3"></div>

            </div>

                 onclick="placeSpecialBet('low')">

                1 - 18

                <div class="bet-chip"
                     id="special-low"></div>

            </div>

            <div class="outside-btn"
                 onclick="placeSpecialBet('even')">

                PARNO

                <div class="bet-chip"
                     id="special-even"></div>

            </div>

            <div class="outside-btn red"
                 onclick="placeSpecialBet('red')">

                CRVENO

                <div class="bet-chip"
                     id="special-red"></div>

            </div>

            <div class="outside-btn black"
                 onclick="placeSpecialBet('black')">

                CRNO

                <div class="bet-chip"
                     id="special-black"></div>

            </div>

            <div class="outside-btn"
                 onclick="placeSpecialBet('odd')">

                NEPARNO

                <div class="bet-chip"
                     id="special-odd"></div>

            </div>

            <div class="outside-btn"
                 onclick="placeSpecialBet('high')">

                19 - 36

                <div class="bet-chip"
                     id="special-high"></div>

            </div>

        </div>

    </div>

</div>

<div id="result"></div>

<div id="spinMessage" class="spin-message hidden"></div>

<div class="history-panel">
    <h2>Istorija brojeva</h2>
    <div id="historyList" class="history-list"></div>
</div>

<div id="popup" class="popup hidden">

    <div class="popup-box">

        <div id="popupText"></div>

        <button onclick="closePopup()">
            OK
        </button>

    </div>

</div>

<div id="addMoneyPopup" class="popup hidden">
    <div class="popup-box">
        <div style="margin-bottom:16px; font-size:18px;">Koliko para želiš da dodaš?</div>
        <input id="addMoneyInput" type="number" min="1" step="10" value="500" style="width:100%; padding:10px 12px; font-size:16px; border-radius:12px; border:1px solid rgba(255,255,255,0.18); background:#0f172a; color:white;" />
        <div style="display:flex; justify-content:space-between; gap:10px; margin-top:18px;">
            <button onclick="confirmAddMoney()">Potvrdi</button>
            <button onclick="hideAddMoneyModal()">Otkaži</button>
        </div>
    </div>
</div>

<script>

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const ball = document.getElementById("ball");

let money = Number('{{ current_user.balance | default(1000) }}');
let chip = 10;
let spinning = false;
let totalBet = 0;
let rotation = 0;
let lastMoney = null;
let ballAngle = 0;

const bets = {};
const specialBets = {};
let lastPlacedBets = {};
let lastPlacedSpecialBets = {};
const spinHistory = [];
const maxHistoryItems = 12;

const numbers = [
0,32,15,19,4,21,2,25,17,34,6,27,
13,36,11,30,8,23,10,5,24,16,33,1,
20,14,31,9,22,18,29,7,28,12,35,3,26
];

const redNumbers = [
32,19,21,25,34,27,36,30,23,
5,16,1,14,9,18,7,12,3
];

const total = numbers.length;
const arc = Math.PI * 2 / total;
ballAngle = arc / 2 + Math.PI / 2;

function getColor(num){

    if(num === 0) return "green";

    return redNumbers.includes(num)
        ? "red"
        : "black";
}

function drawWheel(){

    ctx.clearRect(0,0,360,360);

    for(let i=0;i<total;i++){

        const angle = i * arc + rotation;

        ctx.beginPath();

        ctx.moveTo(180,180);

        ctx.arc(
            180,
            180,
            160,
            angle,
            angle + arc
        );

        ctx.fillStyle = getColor(numbers[i]);
        ctx.fill();

        ctx.strokeStyle = "white";
        ctx.stroke();

        ctx.save();

        ctx.translate(180,180);

        ctx.rotate(angle + arc / 2);

        ctx.fillStyle = "white";
        ctx.font = "14px Arial";
        ctx.textAlign = "right";

        ctx.fillText(numbers[i],145,5);

        ctx.restore();
    }

    ctx.beginPath();

    ctx.arc(180,180,45,0,Math.PI * 2);

    ctx.fillStyle = "#222";
    ctx.fill();
}

function updateBallPosition(angle){
    const radius = 118;
    ball.style.left = (180 + Math.cos(angle - Math.PI/2) * radius - 8) + "px";
    ball.style.top = (180 + Math.sin(angle - Math.PI/2) * radius - 8) + "px";
}

function createTable(){

    const table = document.getElementById("rouletteTable");

    for(let n=1;n<=36;n++){

        const cell = document.createElement("div");

        cell.classList.add("cell");

        if(redNumbers.includes(n)){
            cell.classList.add("red-cell");
        }else{
            cell.classList.add("black-cell");
        }

        cell.id = `bet-cell-${n}`;
        cell.innerHTML = `
            ${n}
            <div class="bet-chip" id="bet-${n}"></div>
        `;

        cell.onclick = ()=>placeNumberBet(n);

        table.appendChild(cell);
    }
}

function setButtonsDisabled(state){

    document.querySelectorAll("button")
        .forEach(btn=>{
            btn.disabled = state;
        });
}

function showAddMoneyModal(){
    if(spinning) return;
    document.getElementById("addMoneyInput").value = 500;
    document.getElementById("addMoneyPopup").classList.remove("hidden");
}

function hideAddMoneyModal(){
    document.getElementById("addMoneyPopup").classList.add("hidden");
}

function confirmAddMoney(){
    const amount = Number(document.getElementById("addMoneyInput").value);
    if(isNaN(amount) || amount <= 0){
        showPopup("Unesi pozitivan iznos.");
        return;
    }

    money += amount;
    updateMoney('Depozit', amount);
    hideAddMoneyModal();
    showPopup(`Dodata su €${amount}.`);
}

function claimDailyBonus() {
    const now = Date.now();
    const lastClaim = localStorage.getItem('last_bj_bonus');
    const day = 24 * 60 * 60 * 1000;

    if (!lastClaim || now - lastClaim > day) {
        money += 100;
        localStorage.setItem('last_bj_bonus', now);
        updateMoney();
        showPopup("🎁 Preuzeli ste €100 dnevnog bonusa!");
    } else {
        const timeLeft = Math.ceil((day - (now - lastClaim)) / (1000 * 60 * 60));
        showPopup(`Bonus je dostupan ponovo za ${timeLeft} sati.`);
    }
}

function setChip(value){

    if(spinning) return;

    chip = value;

    document.getElementById("chipValue")
        .innerText = chip;

    updateChipButtons();
}

function updateChipButtons(){
    document.querySelectorAll(".chip-btn").forEach(btn => {
        btn.classList.toggle(
            "active",
            Number(btn.dataset.value) === chip
        );
    });
}

function animateValue(el, start, end, duration) {
    let startTimestamp = null;
    const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const value = Math.floor(progress * (end - start) + start);
        el.innerText = value;
        if (progress < 1) {
            window.requestAnimationFrame(step);
        }
    };
    window.requestAnimationFrame(step);
}

function updateMoney(gameName, amount){
    const moneyEl = document.getElementById("money");
    if (lastMoney === null) {
        moneyEl.innerText = money;
        lastMoney = money;
    } else if (lastMoney !== money) {
        animateValue(document.getElementById("money"), lastMoney, money, 500);
        lastMoney = money;
    }
    localStorage.setItem('casino_balance', money);

    fetch('/update_balance', {
        method: 'POST',
        keepalive: true,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            balance: money,
            game_name: gameName,
            amount: amount 
        })
    });
}

function updateTotalBet(){

    totalBet = 0;

    for(let key in bets){
        totalBet += bets[key];
    }

    for(let key in specialBets){
        totalBet += specialBets[key];
    }

    document.getElementById("totalBet")
        .innerText = totalBet;
}

function clearResultMarkers(){
    document.querySelectorAll(".win-bet, .lost-bet").forEach(el => {
        el.classList.remove("win-bet", "lost-bet");
    });
}

function markNumberBetResult(number, won){
    const cell = document.getElementById(`bet-cell-${number}`);
    if(cell){
        cell.classList.toggle("win-bet", won);
        cell.classList.toggle("lost-bet", !won);
    }
}

function markSpecialBetResult(type, won){
    const specialChip = document.getElementById(`special-${type}`);
    if(specialChip && specialChip.parentElement){
        specialChip.parentElement.classList.toggle("win-bet", won);
        specialChip.parentElement.classList.toggle("lost-bet", !won);
    }
}

function renderHistory(){
    const historyList = document.getElementById("historyList");
    historyList.innerHTML = "";

    spinHistory.slice().reverse().forEach(item => {
        const chipEl = document.createElement("div");
        chipEl.className = `history-chip ${item.color}`;
        chipEl.innerText = item.number;
        historyList.appendChild(chipEl);
    });
}

function showSpinMessage(text){
    const container = document.getElementById("spinMessage");
    container.innerHTML = `<div class="spin-message-box">${text}</div>`;
    container.classList.remove("hidden");

    setTimeout(() => {
        container.classList.add("hidden");
    }, 3600);
}

function showPopup(text){

    document.getElementById("popupText")
        .innerText = text;

    document.getElementById("popup")
        .classList.remove("hidden");
}

function closePopup(){

    document.getElementById("popup")
        .classList.add("hidden");
}

function placeNumberBet(number){

    if(spinning) return;

    if(totalBet + chip > money){

        showPopup("Nemaš dovoljno novca.");
        return;
    }

    if(!bets[number]){
        bets[number] = 0;
    }

    bets[number] += chip;

    document.getElementById(`bet-${number}`)
        .innerText = `€${bets[number]}`;

    updateTotalBet();
}

function repeatBet() {
    if (spinning || Object.keys(lastPlacedBets).length === 0 && Object.keys(lastPlacedSpecialBets).length === 0) return;
    
    // Izračunaj koliko novca treba za ponavljanje
    let cost = 0;
    for(let k in lastPlacedBets) cost += lastPlacedBets[k];
    for(let k in lastPlacedSpecialBets) cost += lastPlacedSpecialBets[k];

    if (cost > money) {
        showPopup("Nemaš dovoljno novca za ponavljanje uloga.");
        return;
    }

    for(let k in lastPlacedBets) if(lastPlacedBets[k] > 0) { bets[k] = lastPlacedBets[k]; document.getElementById(`bet-${k}`).innerText = `€${bets[k]}`; }
    for(let k in lastPlacedSpecialBets) if(lastPlacedSpecialBets[k] > 0) { specialBets[k] = lastPlacedSpecialBets[k]; document.getElementById(`special-${k}`).innerText = `€${specialBets[k]}`; }
    updateTotalBet();
}

function placeSpecialBet(type){

    if(spinning) return;

    if(totalBet + chip > money){

        showPopup("Nemaš dovoljno novca.");
        return;
    }

    if(!specialBets[type]){
        specialBets[type] = 0;
    }

    specialBets[type] += chip;

    document.getElementById(`special-${type}`)
        .innerText = `€${specialBets[type]}`;

    updateTotalBet();
}

function spinWheel(){

    if(spinning) return;

    clearResultMarkers();

    if(totalBet <= 0){
        showPopup("Postavi ulog prvo.");
        return;
    }

    spinning = true;
    setButtonsDisabled(true);

    document.getElementById("result").innerHTML = "";

    // Sačuvaj trenutne uloge za ponavljanje
    lastPlacedBets = JSON.parse(JSON.stringify(bets));
    lastPlacedSpecialBets = JSON.parse(JSON.stringify(specialBets));

    const finalIndex = Math.floor(Math.random() * total);
    const winNumber = numbers[finalIndex];
    const color = getColor(winNumber);
    const moneyBefore = money;
    const winningNumbers = [];
    const losingNumbers = [];
    const winningSpecials = [];
    const losingSpecials = [];

    const extraSpins = Math.PI * 2 * 6;
    const targetBase = finalIndex * arc + arc / 2 + Math.PI / 2;
    const ballStartAngle = ballAngle;
    const ballExtraSpins = Math.PI * 2 * 8;
    const ballTargetAngle = targetBase + ballExtraSpins + Math.ceil((ballStartAngle - targetBase) / (Math.PI * 2)) * (Math.PI * 2);

    const start = performance.now();
    const duration = 6500;
    const initialRotation = rotation;

    function animate(time){

        const elapsed = time - start;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 4);

        rotation = initialRotation + extraSpins * ease;

        drawWheel();

        ballAngle = ballStartAngle + (ballTargetAngle - ballStartAngle) * ease;
        updateBallPosition(ballAngle);

        if(progress < 1){
            requestAnimationFrame(animate);
        } else {

            spinning = false;
            setButtonsDisabled(false);

            // FINAL LOCK - guarantee correct position
            ballAngle = ballTargetAngle;
            updateBallPosition(ballAngle);

            // Highlight winning number on the table
            const winningCell = document.getElementById(`bet-cell-${winNumber}`);
            if(winningCell) {
                winningCell.classList.add("winning-number-glow");
                setTimeout(() => winningCell.classList.remove("winning-number-glow"), 5000);
            }

            for(let key in bets){
                const amount = bets[key];
                if(amount > 0){
                    if(parseInt(key) === winNumber){
                        money += amount * 35;
                        winningNumbers.push(parseInt(key));
                    } else {
                        losingNumbers.push(parseInt(key));
                    }
                    money -= amount;
                }
            }

            for(let type in specialBets){
                const amount = specialBets[type];
                if(amount <= 0) continue;
                money -= amount;

                let won = false;

                switch(type){
                    case "red": won = color === "red"; break;
                    case "black": won = color === "black"; break;
                    case "green": won = winNumber === 0; break;
                    case "even": won = winNumber !== 0 && winNumber % 2 === 0; break;
                    case "odd": won = winNumber % 2 === 1; break;
                    case "low": won = winNumber >=1 && winNumber <=18; break;
                    case "high": won = winNumber >=19 && winNumber <=36; break;
                    case "dozen1": won = winNumber <=12; break;
                    case "dozen2": won = winNumber <=24 && winNumber >=13; break;
                    case "dozen3": won = winNumber >=25; break;
                }

                if(won){
                    winningSpecials.push(type);
                    if(type === "green") money += amount * 14;
                    else if(type.includes("dozen")) money += amount * 3;
                    else money += amount * 2;
                } else {
                    losingSpecials.push(type);
                }
            }

            winningNumbers.forEach(n => markNumberBetResult(n, true));
            losingNumbers.forEach(n => markNumberBetResult(n, false));
            winningSpecials.forEach(type => markSpecialBetResult(type, true));
            losingSpecials.forEach(type => markSpecialBetResult(type, false));

            const spinNet = money - moneyBefore;
            updateMoney('Rulet', spinNet);

            for(let i = 1; i <= 36; i++){
                bets[i] = 0;
                const el = document.getElementById(`bet-${i}`);
                if(el) el.innerText = "";
            }

            for(let key in specialBets){
                specialBets[key] = 0;
                const el = document.getElementById(`special-${key}`);
                if(el) el.innerText = "";
            }

            updateTotalBet();

            const netText = spinNet >= 0
                ? `Pobedio si €${spinNet}`
                : `Izgubio si €${Math.abs(spinNet)}`;

            document.getElementById("result").innerHTML =
                `🎯 Broj: ${winNumber}<br>Boja: ${color.toUpperCase()}<br>${netText}`;

            spinHistory.push({
                number: winNumber,
                color,
                net: spinNet,
            });
            if(spinHistory.length > maxHistoryItems){
                spinHistory.shift();
            }
            renderHistory();
            showSpinMessage(`Broj: ${winNumber}<br>${color.toUpperCase()}<br>${netText}`);
        }
    }

    requestAnimationFrame(animate);
}

window.addEventListener('storage', (e) => {
    if (e.key === 'casino_balance' && !spinning) {
        money = Number(e.newValue);
        updateMoney();
    }
});

function toggleNavMenu() {
    const navContainer = document.querySelector('.nav-container');
    navContainer.classList.toggle('open');
}

drawWheel();
createTable();
updateChipButtons();
updateBallPosition(ballAngle);
updateMoney();

</script>
