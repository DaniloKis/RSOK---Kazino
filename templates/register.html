<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <title>Kazino — Registracija</title>
    <style>
        body{background:#0f172a; color:white; text-align:center; padding:100px; font-family:sans-serif;} 
        input{padding:10px; margin:10px; border-radius:5px; border:none;} 
        button{padding:10px 20px; background:#16a34a; color:white; border:none; border-radius:5px; cursor:pointer;}
        
        /* Uklanjanje strelica za broj */
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
    </style>
</head>
<body>
    <h2>Registracija</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <p style="color:#f87171;">{{ msg }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <input name="username" placeholder="Korisničko ime" required><br>
        <input type="password" name="password" placeholder="Lozinka" required><br>
        <input name="card_number" placeholder="Broj kreditne kartice" maxlength="20" required><br>
        <label style="display:inline-block; margin:10px;">
            <input type="checkbox" name="over_18" required> Potvrđujem da imam preko 18 godina
        </label><br>
        <button type="submit">Napravi nalog</button>
    </form>
    <p style="margin-top:20px;"><a href="/login" style="color:gold;">Već imaš nalog? Prijavi se</a></p>
</body>
</html>
