<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body{background:#0f172a; color:white; text-align:center; padding:100px; font-family:sans-serif;} 
        input{padding:10px; margin:10px; border-radius:5px; border:none;} 
        button{padding:10px 20px; background:#16a34a; color:white; border:none; border-radius:5px; cursor:pointer;}
        
        /* Uklanjanje strelica za broj */
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
    </style>
</head>
<body>
    <h2>Registracija</h2>
    <form method="POST">
        <input name="username" placeholder="Korisničko ime" required><br>
        <input type="password" name="password" placeholder="Lozinka" required><br>
        <input type="number" name="balance" placeholder="Početni balans (npr. 500)" value="1000"><br>
        <button type="submit">Napravi nalog</button>
    </form>
</body>
</html>
