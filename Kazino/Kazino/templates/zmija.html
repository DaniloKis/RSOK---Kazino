<!-- Premestite ovaj fajl u templates/zmija.html -->
<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casino Snake 🐍</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: radial-gradient(circle at top, #0f172a, #020617);
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }

    .nav-container {
        position: fixed;
        top: -60px;
        left: 0;
        width: 100%;
        z-index: 1002;
        transition: top 0.3s ease;
    }
    .nav-container.open { top: 0; }
    .nav-bar {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        padding: 15px;
        display: flex;
        justify-content: center;
        gap: 20px;
        border-bottom: 1px solid rgba(34, 197, 94, 0.3);
    }
    .menu-hint {
        position: absolute;
        bottom: -30px;
        left: 50%;
        transform: translateX(-50%);
        background: #22c55e;
        color: black;
        padding: 4px 20px;
        border-radius: 0 0 10px 10px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
    }
    .nav-bar a { color: white; text-decoration: none; font-weight: bold; opacity: 0.7; transition: 0.3s; }
    .nav-bar a:hover { opacity: 1; color: #22c55e; }
    .nav-bar .bonus-link { background: #facc15; color: #000 !important; padding: 5px 12px; border-radius: 8px; text-transform: uppercase; font-size: 12px; }

    h1 { margin-top: 50px; color: #22c55e; text-shadow: 0 0 15px rgba(34, 197, 94, 0.5); }
    
    .stats-container {
        display: flex;
        gap: 20px;
        margin: 20px;
        background: rgba(255, 255, 255, 0.05);
        padding: 15px 25px;
        border-radius: 15px;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .stat-box { text-align: center; }
    .stat-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
    .stat-value { font-size: 20px; font-weight: bold; color: #facc15; }

    #game-canvas {
        background: #0f172a;
        border: 4px solid #1e293b;
        border-radius: 10px;
        box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    .controls {
        margin-top: 20px;
        display: flex;
        gap: 15px;
        align-items: center;
    }
    input[type="number"] {
        background: #1e293b;
        border: 1px solid #334155;
        color: white;
        padding: 10px;
        border-radius: 8px;
        width: 100px;
        font-size: 16px;
        -moz-appearance: textfield;
        appearance: textfield;
    }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    button {
        background: #22c55e;
        color: white;
        border: none;
        padding: 10px 25px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }
    button:hover { transform: scale(1.05); background: #16a34a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .instructions {
        margin-top: 15px;
        font-size: 14px;
        color: #64748b;
    }

    .popup {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2000;
        display: none;
    }
    .popup-content {
        background: #1e293b;
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        border: 2px solid #ef4444;
    }
    .cashout-popup {
        background: #1e293b;
        border: 2px solid #facc15;
    }
</style>
</head>
<body>

<div class="nav-container">
    <div class="nav-bar">
        <a href="/">🏠 Home</a>
        <a href="/blackjack">🃏 Blackjack</a>
        <a href="/rulet">🎡 Rulet</a>
        <a href="/slot">🎰 Slot</a>
        <a href="/plinko">🎯 Plinko</a>
        <a href="/snake" style="opacity: 1; color: #22c55e;">🐍 Zmija</a>
        <a href="/profile">👤 Profil</a>
    </div>
    <div class="menu-hint" onclick="toggleNavMenu()">MENI ☰</div>
</div>

<h1>🐍 CASINO SNAKE</h1>

<div class="stats-container">
    <div class="stat-box">
        <div class="stat-label">Balans</div>
        <div class="stat-value">€<span id="balance">1000</span></div>
    </div>
    <div class="stat-box">
        <div class="stat-label">Trenutni Profit</div>
        <div class="stat-value" style="color: #22c55e;">€<span id="session-win">0</span></div>
    </div>
    <div class="stat-box">
        <div class="stat-label">Množilac Zarade</div>
        <div class="stat-value" id="multiplier-display" style="color: #60a5fa;">x1.0</div>
    </div>
</div>

<canvas id="game-canvas" width="400" height="400"></canvas>

<div class="controls">
    <div style="display:flex; flex-direction:column; gap:5px;">
        <label style="font-size:12px; color:#94a3b8;">ULOG ZA IGRU</label>
        <input type="number" id="bet-amount" value="10" min="5">
    </div>
    <button id="start-btn" onclick="startGame()">ZAPOČNI IGRU</button>
</div>

<p class="instructions">Svaki novi nivo (1x, 2x...) nudi Cash Out. Posle 2x, množilac zarade raste, ali i rizik! 🚀</p>

<div id="game-over-popup" class="popup">
    <div class="popup-content">
        <h2 style="color: #ef4444; margin-bottom: 10px;">IGRA GOTOVA!</h2>
        <p id="final-msg" style="margin-bottom: 20px; font-size: 18px;"></p>
        <button onclick="closePopup('game-over-popup')">PONOVO</button>
    </div>
</div>

<div id="decision-popup" class="popup">
    <div class="popup-content cashout-popup">
        <h2 style="color: #facc15; margin-bottom: 10px;">DOSTIGNUT MILJOKAZ! 🚩</h2>
        <p id="decision-msg" style="margin-bottom: 20px; font-size: 18px;"></p>
        <div style="display:flex; gap:10px; justify-content:center;">
            <button onclick="cashOut()" style="background:#22c55e;">IZKEŠIRAJ (SAVE)</button>
            <button onclick="continueGame()" style="background:#64748b;">NASTAVI (RISK)</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let balance = Number('{{ current_user.balance | default(1000) }}');
    let snake = [{x: 10, y: 10}];
    let food = {x: 5, y: 5};
    let obstacles = [];
    let dx = 0;
    let dy = 0;
    let sessionWin = 0;
    let currentBet = 0;
    let gameRunning = false;
    let gameLoop;
    let lastMilestone = 0; // 0: none, 1: 1x bet, 2: 2x bet, itd.
    let rewardMultiplier = 1.0;

    function updateUI(gameName, amount) {
        document.getElementById('balance').innerText = balance.toFixed(2);
        document.getElementById('session-win').innerText = sessionWin.toFixed(2);
        document.getElementById('multiplier-display').innerText = `x${rewardMultiplier.toFixed(1)}`;
        localStorage.setItem('casino_balance', balance);

        const payload = { balance: balance };
        if (gameName && amount !== undefined && amount !== 0) {
            payload.game_name = gameName;
            payload.amount = amount;
        }

        fetch('/update_balance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    }

    function toggleNavMenu() {
        document.querySelector('.nav-container').classList.toggle('open');
    }

    function claimDailyBonus() {
        const now = Date.now();
        const lastClaim = localStorage.getItem('last_bj_bonus');
        const day = 24 * 60 * 60 * 1000;

        if (!lastClaim || now - lastClaim > day) {
            balance += 100;
            localStorage.setItem('last_bj_bonus', now);
            updateUI();
            alert("🎁 Preuzeli ste €100 dnevnog bonusa!");
        } else {
            alert("Bonus je dostupan jednom dnevno.");
        }
    }

    function startGame() {
        const betInput = document.getElementById('bet-amount');
        currentBet = Number(betInput.value);

        if (currentBet > balance) {
            alert("Nemaš dovoljno novca!");
            return;
        }

        balance -= currentBet;
        sessionWin = 0;
        updateUI();
        lastMilestone = 0;
        rewardMultiplier = 0.6;

        // Reset game state
        snake = [{x: 10, y: 10}];
        dx = 1; dy = 0;
        generateFood();
        generateObstacles();
        gameRunning = true;
        document.getElementById('start-btn').disabled = true;
        betInput.disabled = true;

        if (gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(draw, 100);
    }

    function generateFood() {
        food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
        // Proveri da li je hrana na zmiji ili prepreci
        if (snake.some(s => s.x === food.x && s.y === food.y) || 
            obstacles.some(o => o.x === food.x && o.y === food.y)) {
            generateFood();
        }
    }

    function generateObstacles() {
        obstacles = [];
        const count = 8; // Broj prepreka
        for (let i = 0; i < count; i++) {
            let obs = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            // Ne stavljaj prepreku blizu početka zmije
            if (Math.abs(obs.x - 10) > 2 && Math.abs(obs.y - 10) > 2) {
                obstacles.push(obs);
            }
        }
    }

    function draw() {
        moveSnake();
        if (!gameRunning) return;

        // Clear canvas
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Grid (optional, for aesthetics)
        ctx.strokeStyle = 'rgba(255,255,255,0.02)';
        for(let i=0; i<canvas.width; i+=gridSize) {
            ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke();
        }

        // Draw Obstacles
        ctx.fillStyle = '#ef4444';
        obstacles.forEach(o => {
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ef4444';
            ctx.fillRect(o.x * gridSize + 2, o.y * gridSize + 2, gridSize - 4, gridSize - 4);
        });

        // Draw Food
        ctx.fillStyle = '#facc15';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#facc15';
        ctx.beginPath();
        ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI*2);
        ctx.fill();

        // Draw Snake
        snake.forEach((part, index) => {
            ctx.fillStyle = index === 0 ? '#22c55e' : '#16a34a';
            ctx.shadowBlur = index === 0 ? 10 : 0;
            ctx.shadowColor = '#22c55e';
            ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
        });
        ctx.shadowBlur = 0;
    }

    function spawnExtraObstacle() {
        let obs = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
        // Nemoj staviti prepreku direktno na zmiju ili hranu
        const onSnake = snake.some(s => s.x === obs.x && s.y === obs.y);
        const onFood = food.x === obs.x && food.y === obs.y;
        
        if (onSnake || onFood) {
            spawnExtraObstacle();
            return;
        }
        obstacles.push(obs);
    }

    function aiDecideMove() {
        const head = snake[0];
        
        // Kalkulacija rizika: Šansa za grešku raste kada profit pređe ulog
        const profitRatio = sessionWin / currentBet; 
        const mistakeChance = profitRatio > 1 ? Math.min(0.4, (profitRatio - 1) * 0.25) : 0;

        const directions = [
            { x: 0, y: -1 }, // gore
            { x: 0, y: 1 },  // dole
            { x: -1, y: 0 }, // levo
            { x: 1, y: 0 }   // desno
        ];

        let bestMove = null;
        let minDistance = Infinity;

        directions.forEach(move => {
            const nextX = head.x + move.x;
            const nextY = head.y + move.y;

            let isWall = nextX < 0 || nextX >= tileCount || nextY < 0 || nextY >= tileCount;
            let isObstacle = obstacles.some(o => o.x === nextX && o.y === nextY);
            let isSelf = snake.some(s => s.x === nextX && s.y === nextY);

            // AI MISTAKE LOGIC: Što je veći profit, AI će češće "prevideti" prepreku
            if ((isWall || isObstacle || isSelf) && Math.random() < mistakeChance) {
                isWall = false;
                isObstacle = false;
                isSelf = false;
            }

            if (!isWall && !isObstacle && !isSelf) {
                // Izračunaj distancu do hrane (Manhattan distance)
                const dist = Math.abs(nextX - food.x) + Math.abs(nextY - food.y);
                
                if (dist < minDistance) {
                    minDistance = dist;
                    bestMove = move;
                }
            }
        });

        if (bestMove) {
            dx = bestMove.x;
            dy = bestMove.y;
        }
    }

    function moveSnake() {
        aiDecideMove(); // AI preuzima kontrolu pre svakog pokreta

        const head = {x: snake[0].x + dx, y: snake[0].y + dy};

        // Zidovi
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            endGame("Udario si u zid!", false);
            return;
        }

        // Prepreke
        if (obstacles.some(o => o.x === head.x && o.y === head.y)) {
            endGame("Udario si u bombu! 💣", false);
            return;
        }

        // Samosebe
        if (snake.some(s => s.x === head.x && s.y === head.y)) {
            endGame("Ugrizao si se za rep!", false);
            return;
        }

        snake.unshift(head);

        // Hrana
        if (head.x === food.x && head.y === food.y) {
            sessionWin += (currentBet * 0.15) * rewardMultiplier; // Profit pomnožen sa trenutnim multiplierom
            updateUI();
            
            // Ako je igrač u profitu, svaka bobica stvara novu prepreku
            if (sessionWin >= currentBet) {
                spawnExtraObstacle();
            }

            // PROVERA MILJOKAZA (Opcija za Cash Out)
            checkMilestones();

            generateFood();
        } else {
            snake.pop();
        }
    }

    function checkMilestones() {
        // Proverava sledeći celobrojni miljokaz (1x, 2x, 3x...)
        let nextLevel = lastMilestone + 1;
        if (sessionWin >= currentBet * nextLevel) {
            triggerDecision(nextLevel);
        }
    }

    function triggerDecision(level) {
        lastMilestone = level;
        gameRunning = false;
        clearInterval(gameLoop);
        
        let bonusInfo = "";
        // Nakon drugog miljokaza, povećavamo multiplier za sledeću fazu
        if (lastMilestone >= 2) {
            rewardMultiplier += 0.5; // Svaki sledeći nivo dodaje 0.5x na profit
            bonusInfo = `<br><span style="color:#60a5fa; font-size:16px;">🔥 BONUS: Množilac zarade raste na x${rewardMultiplier.toFixed(1)}!</span>`;
        }

        document.getElementById('decision-msg').innerHTML = 
            `Zarada: <span style="color:#22c55e; font-weight:bold;">€${sessionWin.toFixed(2)}</span>${bonusInfo}`;
        
        document.getElementById('decision-popup').style.display = 'flex';
        updateUI();
    }

    function endGame(reason, isCashOut) {
        gameRunning = false;
        clearInterval(gameLoop);
        
        let netResult = 0;
        if (!isCashOut) {
            netResult = -currentBet;
            sessionWin = 0; 
        } else {
            netResult = sessionWin;
            balance += sessionWin;
        }

        updateUI("Zmija", netResult);

        document.getElementById('final-msg').innerHTML = `${reason}<br><br>Osvojio si: <span style="color:#22c55e">€${sessionWin.toFixed(2)}</span>`;
        document.getElementById('game-over-popup').style.display = 'flex';
    }

    function cashOut() {
        document.getElementById('decision-popup').style.display = 'none';
        endGame("Odlučio si da uzmeš pare!", true);
    }

    function continueGame() {
        document.getElementById('decision-popup').style.display = 'none';
        gameRunning = true;
        gameLoop = setInterval(draw, 100);
    }

    function closePopup(id) {
        document.getElementById(id).style.display = 'none';
        document.getElementById('start-btn').disabled = false;
        document.getElementById('bet-amount').disabled = false;
        // Reset canvas for next game
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    updateUI();
</script>
</body>
</html>
